name: Installer Linux

# Builds NeonVerbale-<version>-linux-x86_64.run, tests it end to end on a clean home
# (install, transcription, windows on a virtual display, uninstall) and, for a version
# tag, attaches it to that tag's release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Strumenti di sistema per i test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb espeak-ng libgl1 libegl1 libxkbcommon0 imagemagick

      - name: Ambiente di build con le versioni provate
        run: |
          python -m venv .venv-build
          TORCH=$(grep -E '^torch==' installer/constraints.txt | cut -d= -f3)
          .venv-build/bin/pip install -q "torch==$TORCH" "torchaudio==$TORCH" --index-url https://download.pytorch.org/whl/cpu
          .venv-build/bin/pip install -q -r requirements.txt -c installer/constraints.txt

      - name: Modello pyannote (release "modelli-1")
        run: gh release download modelli-1 --repo "$GITHUB_REPOSITORY" -p 'pyannote-*.tar.gz' -D build/linux

      - name: Costruzione del .run
        run: bash installer/build_linux.sh .venv-build/bin/python build/linux/pyannote-speaker-diarization-community-1.tar.gz

      - name: "Prova: installazione da terminale"
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          sh dist/NeonVerbale-*-linux-x86_64.run --cli -y --cpu
          test -x "$HOME/.local/bin/neon-verbale"
          test -f "$HOME/.local/share/applications/neon-verbale.desktop"
          cat "$HOME/.local/lib/neon-verbale/install.json"

      - name: "Prova: trascrizione"
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$RUNNER_TEMP/prova"
          espeak-ng -v it -s 140 -w "$RUNNER_TEMP/prova/riunione.wav" \
            "Buongiorno a tutti. Oggi parliamo del progetto e delle prossime scadenze. Grazie, la riunione è finita."
          "$HOME/.local/bin/neon-verbale" --trascrivi "$RUNNER_TEMP/prova/riunione.wav" --no-voices
          cat "$RUNNER_TEMP/prova/Trascrizioni/riunione/trascrizione.md"
          grep -qiE "riunione|progetto|scadenze" "$RUNNER_TEMP/prova/Trascrizioni/riunione/trascrizione.md"
          # Another meeting language, detected by Whisper.
          espeak-ng -v en -s 140 -w "$RUNNER_TEMP/prova/meeting.wav" \
            "Good morning everyone. Today we talk about the project and the next deadlines. Thank you, the meeting is over."
          "$HOME/.local/bin/neon-verbale" --trascrivi "$RUNNER_TEMP/prova/meeting.wav" --no-voices --language auto
          cat "$RUNNER_TEMP/prova/Trascrizioni/meeting/trascrizione.md"
          grep -qiE "meeting|project|deadlines" "$RUNNER_TEMP/prova/Trascrizioni/meeting/trascrizione.md"
          grep -q '"language": "en"' "$RUNNER_TEMP/prova/Trascrizioni/meeting/_lavoro/asr.json"

      - name: "Prova: finestra del programma e wizard (schermo virtuale)"
        run: |
          export HOME="$RUNNER_TEMP/home"
          APP="$HOME/.local/lib/neon-verbale"
          export NEON_SMOKE_SHOTS="$RUNNER_TEMP/screenshot" && mkdir -p "$NEON_SMOKE_SHOTS"
          # The window in every interface language (Linux's X core fonts only cover Latin-1).
          xvfb-run -a -s "-screen 0 1100x780x24" "$APP/runtime/bin/python3" -I -c "
          import os, subprocess, tkinter as tk
          from meeting_transcriber import gui, i18n, theme
          root = tk.Tk(className='neon-verbale')
          app = gui.App(root, theme.apply(root))
          app.add_files([os.environ['RUNNER_TEMP'] + '/prova/riunione.wav', os.environ['RUNNER_TEMP'] + '/prova/meeting.wav'])
          root.geometry('+0+0')
          codes = list(i18n.UI_LANGUAGES)
          assert 'zh' not in codes
          def shot(i):
              if i == len(codes):
                  return root.destroy()
              app.ui_box.current(i)
              app.on_ui_language()
              root.after(800, lambda: (subprocess.run(['import', '-window', 'root', os.environ['NEON_SMOKE_SHOTS'] + f'/programma_{codes[i]}.png']), shot(i + 1)))
          root.after(2500, lambda: shot(0))
          root.mainloop()
          print('finestra ok')"
          xvfb-run -a -s "-screen 0 1100x780x24" sh dist/NeonVerbale-*-linux-x86_64.run --smoke-ui
          echo "wizard ok"
          ls "$NEON_SMOKE_SHOTS"

      - name: "Prova: disinstallazione"
        run: |
          export HOME="$RUNNER_TEMP/home"
          "$HOME/.local/bin/neon-verbale" --disinstalla -y --remove-data
          test ! -e "$HOME/.local/lib/neon-verbale"
          test ! -e "$HOME/.local/bin/neon-verbale"
          test ! -e "$HOME/.local/share/applications/neon-verbale.desktop"
          test ! -e "$HOME/.local/share/neon-verbale"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/NeonVerbale-*-linux-x86_64.run

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-linux
          path: ${{ runner.temp }}/screenshot

      - name: Allegato alla release del tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "NEON VERBALE ${GITHUB_REF_NAME#v}" --notes "Vedi CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" dist/NeonVerbale-*-linux-x86_64.run --repo "$GITHUB_REPOSITORY" --clobber
